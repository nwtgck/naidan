name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  # Keep the existing required check name; skipped/cancelled shards cannot pass.
  lint:
    runs-on: ubuntu-latest
    needs: lint_checks
    if: ${{ always() }}
    steps:
      - name: Require both lint checks
        env:
          LINT_RESULT: ${{ needs.lint_checks.result }}
        run: test "$LINT_RESULT" = success

  lint_checks:
    name: lint (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Move the component subtree off the slower non-translation check.
        scope: [strings-components, other]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: $/.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true -e NODE_OPTIONS \
            node:22-bookworm npm run lint:ci:${{ matrix.scope }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        uses: $/.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Run tests
        if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
        shell: bash
        env:
          FORCE_COLOR: "1"
          npm_config_color: always
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs"
          set -o pipefail

          # Docker allocates the pseudo-TTY formerly provided by script;
          # keep the colored reporter output and the failing exit status.
          docker run --rm -t \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true -e FORCE_COLOR -e npm_config_color \
            node:22-bookworm \
            npm run test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            2>&1 | tee "$RUNNER_TEMP/test-logs/npm-test-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}.log"

      - name: Upload test shard log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-test-log-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: ${{ runner.temp }}/test-logs/
          if-no-files-found: warn

  merge_test_logs:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download all test shard logs
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: npm-test-log-shard-*
          path: all-test-logs
          merge-multiple: true

      - name: Upload merged test logs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-test-logs
          path: all-test-logs/
          if-no-files-found: error

  test_python_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run Python server tests (Isolated)
        run: |
          cd naidan-server.py
          ./run_test.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: $/.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Run typecheck
        id: typecheck
        # Use the same project-reference and PWA checks as local builds.
        env:
          NODE_OPTIONS: >-
            --max-old-space-size=6144 --report-on-fatalerror
            --report-exclude-env --report-exclude-network --report-directory=/typecheck-reports
        run: |
          mkdir -p "$RUNNER_TEMP/typecheck-reports"
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -v "$PWD/naidan-server:/work/naidan-server:ro" \
            -v "$PWD/package.json:/work/package.json:ro" \
            -v "$RUNNER_TEMP/typecheck-reports:/typecheck-reports" \
            -w /work \
            -e HOME=/tmp -e CI=true -e NODE_OPTIONS \
            node:22-bookworm \
            npm run typecheck

      - name: Summarize Node fatal errors from typecheck
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          for report in "$RUNNER_TEMP"/typecheck-reports/report.*.json; do
            [ -f "$report" ] || continue
            jq -c '{
              command: .header.commandLine, node: .header.nodejsVersion,
              heap_used_bytes: .javascriptHeap.usedMemory,
              heap_limit_bytes: .javascriptHeap.memoryLimit,
              max_rss_bytes: .resourceUsage.maxRss
            }' "$report"
          done

  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-digests: >-
        {
          "full-dist-build": "${{ steps.full_dist_build.outputs.artifact-digest }}",
          "standalone-universal-package": "${{ steps.standalone_universal.outputs.artifact-digest }}",
          "standalone-all-locale-packages": "${{ steps.standalone_locales.outputs.artifact-digest }}",
          "naidan-hosted": "${{ steps.hosted.outputs.artifact-digest }}",
          "naidan-server-binary": "${{ steps.server_binary.outputs.artifact-digest }}"
        }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Pull the build tooling image
        run: docker pull node:22-bookworm

      - name: Capture committed source before dependency installation
        run: |
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            node:22-bookworm node scripts/release-integrity.mjs capture-source - > "$RUNNER_TEMP/naidan-build-source.json"

      - name: Install dependencies
        id: npm_install
        uses: $/.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Require unchanged tracked source after installation
        run: |
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          git --no-replace-objects diff --quiet --no-ext-diff "$GITHUB_SHA" --

      - name: Run build
        # Keep headroom for memory-intensive standalone and hosted bundles.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # The build may generate TypeScript/router files in the checkout.
          # Keep Go build scripts read-only for the separate server build.
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -v "$PWD/naidan-server:/work/naidan-server:ro" \
            -v "$PWD/package.json:/work/package.json:ro" \
            -v "$PWD/scripts:/work/scripts:ro" \
            -v "$PWD/build:/work/build:ro" \
            -v "$PWD/.git:/work/.git:ro" \
            -w /work \
            -e HOME=/tmp -e CI=true -e NODE_OPTIONS \
            node:22-bookworm npm run build:all

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: naidan-server/go.mod
          cache: false

      - name: Verify naidan-server build
        run: |
          # build.go copies hosted assets as files and follows source symlinks.
          # Reject non-regular entries before copying the hosted build.
          test -d dist/hosted
          test ! -L dist
          test ! -L dist/hosted
          UNSAFE_ASSET="$(find dist/hosted ! -type f ! -type d -print -quit)"
          if [ -n "$UNSAFE_ASSET" ]; then
            echo "::error::Unsafe hosted build asset: $UNSAFE_ASSET"
            exit 1
          fi
          mkdir "$RUNNER_TEMP/naidan-go"
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/naidan-server,target=/work/naidan-server" \
            --mount "type=bind,source=$(go env GOROOT),target=/goroot,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/naidan-go,target=/scratch" \
            -w /work/naidan-server -e HOME=/tmp -e GOROOT=/goroot -e GOTOOLCHAIN=local \
            -e GOCACHE=/scratch/cache -e GOTMPDIR=/scratch \
            node:22-bookworm bash -euc 'export PATH="/goroot/bin:$PATH"; go run build.go'

      - name: Verify individual artifact inputs
        run: |
          test -f dist/naidan-standalone.zip
          # Capture the command status as well as its output; process
          # substitution alone would hide a failed Docker invocation.
          STANDALONE_LOCALES_OUTPUT="$(
            docker run --rm \
              --network none \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:/work:ro" -w /work \
              -e HOME=/tmp -e CI=true \
              node:22-bookworm \
              npm exec -- tsx --eval "import { UI_LOCALES } from './src/01-models/ui-locale.ts'; process.stdout.write(UI_LOCALES.join('\n'));"
          )"
          test -n "$STANDALONE_LOCALES_OUTPUT"
          mapfile -t STANDALONE_LOCALES <<< "$STANDALONE_LOCALES_OUTPUT"
          test "${#STANDALONE_LOCALES[@]}" -gt 0
          for LOCALE in "${STANDALONE_LOCALES[@]}"; do
            test -f "dist/naidan-standalone-${LOCALE}.zip"
          done
          test -f dist/debug-file-protocol-standalone-build-report.json
          test -d dist/debug-tailwind-standalone
          test -f dist/naidan-hosted.zip
          test -d dist/debug-tailwind-hosted

      - name: Bind release ZIPs and embedded hosted files to this build
        run: |
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/dist,target=/work/dist" \
            --mount "type=bind,source=$RUNNER_TEMP/naidan-build-source.json,target=/source.json,readonly" -w /work \
            node:22-bookworm node scripts/release-integrity.mjs seal-build /source.json

      - name: Upload full dist build artifact
        id: full_dist_build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: full-dist-build
          path: dist/
          if-no-files-found: error

      - name: Upload universal standalone package artifact
        id: standalone_universal
        uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-universal-package
          path: |
            dist/naidan-standalone.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload all standalone locale packages artifact
        id: standalone_locales
        uses: actions/upload-artifact@v7.0.2
        with:
          name: standalone-all-locale-packages
          path: |
            dist/naidan-standalone.zip
            dist/naidan-standalone-*.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload hosted artifact
        id: hosted
        uses: actions/upload-artifact@v7.0.2
        with:
          name: naidan-hosted
          path: |
            dist/naidan-hosted.zip
            dist/debug-tailwind-hosted/
          if-no-files-found: error

      - name: Upload naidan-server binary artifact
        id: server_binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: naidan-server-binary
          path: naidan-server/naidan-server
          if-no-files-found: error

  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: $/.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Check Docs types
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run typecheck:docs

      - name: Test Docs independently
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run test:docs

      - name: Build Docs independently
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run build:docs

      - name: Upload Docs-only artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-dist
          path: docs/dist/
          if-no-files-found: error

  publish_to_cloudflare:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Model pages are already in Hosted. Docs remain deployment-only; do not repack the ZIP.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test -f dist/hosted/sitemap.xml
          test ! -e dist/hosted/404.html
          test -d dist/hosted/llama-cpp-browser
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: $/.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages
        id: cloudflare_pages_deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages',
              description: 'Cloudflare Pages deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy.outputs.deployment-url }}",
            });

  publish_to_cloudflare_local_only:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Model pages are already in Hosted. Docs remain deployment-only; do not repack the ZIP.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test -f dist/hosted/sitemap.xml
          test ! -e dist/hosted/404.html
          test -d dist/hosted/llama-cpp-browser
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers for local-only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /*
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; form-action 'none';

          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: $/.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages (local-only)
        id: cloudflare_pages_deploy_local
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.LOCAL_ONLY_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-local-only
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Publish legacy compatibility deployment (only-local)
        id: cloudflare_pages_deploy_local_legacy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.ONLY_LOCAL_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-only-local
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Local-Only)',
              description: 'Primary local-only version deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_local.outputs.deployment-url }}",
            });

  publish_to_cloudflare_curated:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Model pages are already in Hosted. Docs remain deployment-only; do not repack the ZIP.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test -f dist/hosted/sitemap.xml
          test ! -e dist/hosted/404.html
          test -d dist/hosted/llama-cpp-browser
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers for curated access
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Curated access is intentionally an access-range superset of
          # local-only: keep local-only script/style/img/font/connect
          # allowances, then add Wikipedia/Wikimedia, Hugging Face model
          # downloads, and the sandbox broker requirements.
          # Hugging Face Hub metadata and /resolve/ download redirects use
          # huggingface.co; model-file storage/CDN hosts use *.hf.co (for
          # example, us.aws.cdn.hf.co). Do not pin a region or cloud provider.
          # In CSP, *.hf.co includes nested subdomains, but not hf.co itself.
          # Keep these additions in connect-src only; they allow connections
          # to these hosts, not download-only paths or HTTP methods.
          # Do not add hf.co, *.huggingface.co, or *.hf.space.
          # Safari may not treat script-src 'self' as sufficient for module
          # scripts loaded inside an opaque-origin sandbox iframe, so keep the
          # explicit naidan-curated origins in script-src.
          # Cloudflare Pages may redirect /privacy-fetch-broker.html to the
          # extensionless /privacy-fetch-broker URL. Under COEP: require-corp,
          # the final sandboxed subdocument response also needs CORP, so keep
          # both broker document rules. Do not fix this by adding
          # allow-same-origin to the iframe.
          # The sandboxed broker module graph needs CORP + ACAO, but only
          # under /assets/privacy-fetch-broker/*. Do not make all app assets
          # CORS-readable.
          # The broker is embedded by the same-origin app, so curated CSP must
          # not use frame-ancestors 'none'.
          # Do not add stricter directives such as object-src 'none' or
          # base-uri 'none' here unless local-only gets the same restriction
          # first.
          cat << EOF > dist/hosted/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://naidan-curated.pages.dev https://*.naidan-curated.pages.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://*.wikipedia.org https://*.wikimedia.org https://huggingface.co https://*.hf.co; frame-src 'self'; child-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'none'; manifest-src 'self'

          /privacy-fetch-broker.html
            Cross-Origin-Resource-Policy: cross-origin

          /privacy-fetch-broker
            Cross-Origin-Resource-Policy: cross-origin

          /assets/privacy-fetch-broker/*
            Cross-Origin-Resource-Policy: cross-origin
            Access-Control-Allow-Origin: *

          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: $/.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages (Curated)
        id: cloudflare_pages_deploy_curated
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CURATED_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-curated
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Curated)',
              description: 'Curated-access deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_curated.outputs.deployment-url }}",
            });

  test_release_tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Pull test runtimes (explicit network access)
        run: |
          # The full image includes Git for release_start integration tests.
          docker pull python:3.13-bookworm
          docker pull node:22-bookworm

      - name: Test release tooling offline
        run: |
          docker run --rm --pull=never --network none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            python:3.13-bookworm \
            python -m unittest discover -s scripts/tests -p 'test_*.py'
          docker run --rm --pull=never --network none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges:true \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            node:22-bookworm node --test scripts/tests/*.test.mjs

  prepare_release:
    needs: [build, test_release_tooling]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.distribution.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download the web build
        uses: actions/download-artifact@v8.0.2
        with:
          name: full-dist-build
          path: dist
      - name: Download the CI server binary
        if: github.ref_type == 'branch'
        uses: actions/download-artifact@v8.0.2
        with:
          name: naidan-server-binary
          path: dist/ci-server
      - name: Pull the release tooling image
        run: docker pull node:22-bookworm
      - name: Verify the web build from this run
        run: |
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/work,readonly" -w /work \
            -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            node:22-bookworm node scripts/release-integrity.mjs verify-build dist/naidan-build-receipt.json
      - name: Acquire Go
        if: github.ref_type == 'tag'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: naidan-server/go.mod
          cache: false
      - name: Acquire GoReleaser
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.7.0
          install-only: true
      - name: Package server targets for this tag
        if: github.ref_type == 'tag'
        run: |
          # GoReleaser's before hook executes a temporary Go binary.
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,source=$PWD,target=/work,readonly" \
            --mount "type=bind,source=$PWD/naidan-server,target=/work/naidan-server" \
            --mount "type=bind,source=$PWD/dist,target=/work/dist" \
            --mount "type=bind,source=$(go env GOROOT),target=/goroot,readonly" \
            --mount "type=bind,source=$(command -v goreleaser),target=/usr/local/bin/goreleaser,readonly" \
            -w /work -e HOME=/tmp -e GOROOT=/goroot -e GOTOOLCHAIN=local \
            -e GOCACHE=/work/dist/go-cache -e GOTMPDIR=/work/dist \
            node:22-bookworm bash -euc 'export PATH="/goroot/bin:$PATH"; goreleaser release --skip=publish --clean'

      - name: Assemble the release candidate and freeze its YAML
        id: prepare
        env:
          NAIDAN_WORKFLOW_ARTIFACTS: ${{ needs.build.outputs.artifact-digests }}
        run: |
          mkdir "$RUNNER_TEMP/distribution"
          sha256="$(
            docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/work,readonly" \
              --mount "type=bind,source=$RUNNER_TEMP/distribution,target=/output" \
              -w /work -e GITHUB_REF -e NAIDAN_WORKFLOW_ARTIFACTS node:22-bookworm node scripts/release-integrity.mjs \
              prepare dist/naidan-build-receipt.json /output
          )"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Attest the candidate YAML
        id: attest
        uses: actions/attest@v4.2.2
        with:
          subject-name: naidan-release-integrity.yaml
          subject-digest: sha256:${{ steps.prepare.outputs.sha256 }}
          create-storage-record: false
      - name: Stage the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          SIGNED_SHA256: ${{ steps.prepare.outputs.sha256 }}
        run: |
          docker run --rm --pull=never --network none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$BUNDLE_PATH,target=/bundle.json,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/distribution,target=/output" \
            -e SIGNED_SHA256 node:22-bookworm bash -euc '
              printf "%s  /output/naidan-release-integrity.yaml\n" "$SIGNED_SHA256" | sha256sum --check --status
              cp /bundle.json /output/attestation.bundle.json
            '
      - name: Upload the integrity YAML for inspection
        uses: actions/upload-artifact@v7.0.2
        with:
          name: naidan-integrity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/naidan-release-integrity.yaml
          if-no-files-found: error
      - name: Upload the signed release candidate
        id: distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: naidan-distribution-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution/
          if-no-files-found: error
          compression-level: 0

  release_to_github:
    needs: prepare_release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    permissions:
      contents: write
    # A single reusable job serializes note synchronization AND asset publishing.
    uses: $/.github/workflows/sync-release-notes.yml
    with:
      publish-tag: ${{ github.ref_name }}
      distribution-artifact-id: ${{ needs.prepare_release.outputs.artifact-id }}

  prerelease_to_github:
    needs: prepare_release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed release candidate
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.prepare_release.outputs.artifact-id }}
          path: ${{ runner.temp }}/distribution
          digest-mismatch: error
      - name: Publish the candidate as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh api -H 'Accept: application/vnd.github.sha' "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG")" = "$GITHUB_SHA"
          gh release create "$TAG" "$RUNNER_TEMP"/distribution/assets/* \
            "$RUNNER_TEMP/distribution/naidan-release-integrity.yaml" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false --notes ""
