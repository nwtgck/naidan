name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  # Keep the existing required check name; skipped/cancelled shards cannot pass.
  lint:
    runs-on: ubuntu-latest
    needs: lint_checks
    if: ${{ always() }}
    steps:
      - name: Require both lint checks
        env:
          LINT_RESULT: ${{ needs.lint_checks.result }}
        run: test "$LINT_RESULT" = success

  lint_checks:
    name: lint (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope: [strings, other]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true -e NODE_OPTIONS \
            node:22-bookworm npm run lint:ci:${{ matrix.scope }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        uses: ./.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Run tests
        if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
        shell: bash
        env:
          FORCE_COLOR: "1"
          npm_config_color: always
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs"
          set -o pipefail

          # Docker allocates the pseudo-TTY formerly provided by script;
          # keep the colored reporter output and the failing exit status.
          docker run --rm -t \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true -e FORCE_COLOR -e npm_config_color \
            node:22-bookworm \
            npm run test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            2>&1 | tee "$RUNNER_TEMP/test-logs/npm-test-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}.log"

      - name: Upload test shard log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-test-log-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: ${{ runner.temp }}/test-logs/
          if-no-files-found: warn

  merge_test_logs:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download all test shard logs
        uses: actions/download-artifact@v8
        with:
          pattern: npm-test-log-shard-*
          path: all-test-logs
          merge-multiple: true

      - name: Upload merged test logs
        uses: actions/upload-artifact@v7
        with:
          name: npm-test-logs
          path: all-test-logs/
          if-no-files-found: error

  test_python_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Python server tests (Isolated)
        run: |
          cd naidan-server.py
          ./run_test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        uses: ./.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Ensure licenses.json exists
        run: |
          mkdir -p src/assets
          echo '[{"name": "dummy-package-for-tests", "version": "0.0.0", "license": "DUMMY-LICENSE", "licenseText": "This is a placeholder for CI tests."}]' > src/assets/licenses.json

      - name: Run build
        # Build type checking hit Node's ~4 GiB heap limit before bundling.
        # Keep every check enabled; allow headroom only for this build step.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          # The build may generate TypeScript/router files in the checkout.
          # Keep Go build scripts read-only: the next step runs them on the host.
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -v "$PWD/naidan-server:/work/naidan-server:ro" \
            -v "$PWD/package.json:/work/package.json:ro" \
            -w /work \
            -e HOME=/tmp -e CI=true -e NODE_OPTIONS \
            node:22-bookworm npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: naidan-server/go.mod

      - name: Verify naidan-server build
        run: |
          # build.go copies hosted assets as files and follows source symlinks.
          # Reject non-regular entries before handling Docker-produced outputs
          # with the unsandboxed Go toolchain.
          test -d dist/hosted
          test ! -L dist
          test ! -L dist/hosted
          UNSAFE_ASSET="$(find dist/hosted ! -type f ! -type d -print -quit)"
          if [ -n "$UNSAFE_ASSET" ]; then
            echo "::error::Unsafe hosted build asset: $UNSAFE_ASSET"
            exit 1
          fi
          cd naidan-server
          go run build.go

      - name: Verify individual artifact inputs
        run: |
          test -f dist/naidan-standalone.zip
          # Capture the command status as well as its output; process
          # substitution alone would hide a failed Docker invocation.
          STANDALONE_LOCALES_OUTPUT="$(
            docker run --rm \
              --network none \
              --cap-drop=ALL \
              --security-opt=no-new-privileges:true \
              -u "$(id -u):$(id -g)" \
              -v "$PWD:/work:ro" -w /work \
              -e HOME=/tmp -e CI=true \
              node:22-bookworm \
              npm exec -- tsx --eval "import { UI_LOCALES } from './src/01-models/ui-locale.ts'; process.stdout.write(UI_LOCALES.join('\n'));"
          )"
          test -n "$STANDALONE_LOCALES_OUTPUT"
          mapfile -t STANDALONE_LOCALES <<< "$STANDALONE_LOCALES_OUTPUT"
          test "${#STANDALONE_LOCALES[@]}" -gt 0
          for LOCALE in "${STANDALONE_LOCALES[@]}"; do
            test -f "dist/naidan-standalone-${LOCALE}.zip"
          done
          test -f dist/debug-file-protocol-standalone-build-report.json
          test -d dist/debug-tailwind-standalone
          test -f dist/naidan-hosted.zip
          test -d dist/debug-tailwind-hosted

      - name: Upload full dist build artifact
        uses: actions/upload-artifact@v7
        with:
          name: full-dist-build
          path: dist/

      - name: Upload universal standalone package artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-universal-package
          path: |
            dist/naidan-standalone.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload all standalone locale packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-all-locale-packages
          path: |
            dist/naidan-standalone.zip
            dist/naidan-standalone-*.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload hosted artifact
        uses: actions/upload-artifact@v7
        with:
          name: naidan-hosted
          path: |
            dist/naidan-hosted.zip
            dist/debug-tailwind-hosted/
          if-no-files-found: error

      - name: Upload naidan-server binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: naidan-server-binary
          path: naidan-server/naidan-server

  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/retry-npm-ci
        with:
          node-image: node:22-bookworm

      - name: Check Docs types
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run typecheck:docs

      - name: Test Docs independently
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run test:docs

      - name: Build Docs independently
        run: |
          docker run --rm \
            --network none \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -e HOME=/tmp -e CI=true \
            node:22-bookworm npm run build:docs

      - name: Upload Docs-only artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/dist/
          if-no-files-found: error

  publish_to_cloudflare:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Do not modify/repack the Hosted ZIP or upload a combined artifact.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: ./.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages
        id: cloudflare_pages_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages',
              description: 'Cloudflare Pages deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy.outputs.deployment-url }}",
            });

  publish_to_cloudflare_local_only:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Do not modify/repack the Hosted ZIP or upload a combined artifact.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers for local-only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /*
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; form-action 'none';

          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: ./.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages (local-only)
        id: cloudflare_pages_deploy_local
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.LOCAL_ONLY_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-local-only
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Publish legacy compatibility deployment (only-local)
        id: cloudflare_pages_deploy_local_legacy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.ONLY_LOCAL_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-only-local
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Local-Only)',
              description: 'Primary local-only version deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_local.outputs.deployment-url }}",
            });

  publish_to_cloudflare_curated:
    needs: [build, build_docs]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build_docs.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8
        with:
          name: full-dist-build
          path: dist

      - name: Download Docs-only artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs-dist

      - name: Add Docs to this deployment only
        # Do not modify/repack the Hosted ZIP or upload a combined artifact.
        run: |
          test -f dist/hosted/index.html
          test -f docs-dist/index.html
          test -f docs-dist/404.html
          test -f docs-dist/en/index.html
          test -f docs-dist/ja/index.html
          test ! -e dist/hosted/docs
          mkdir -p dist/hosted/docs
          cp -a docs-dist/. dist/hosted/docs/

      - name: Create _headers for curated access
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Curated access is intentionally an access-range superset of
          # local-only: keep local-only script/style/img/font/connect
          # allowances, then add Wikipedia/Wikimedia, Hugging Face model
          # downloads, and the sandbox broker requirements.
          # Hugging Face Hub metadata and /resolve/ download redirects use
          # huggingface.co; model-file storage/CDN hosts use *.hf.co (for
          # example, us.aws.cdn.hf.co). Do not pin a region or cloud provider.
          # In CSP, *.hf.co includes nested subdomains, but not hf.co itself.
          # Keep these additions in connect-src only; they allow connections
          # to these hosts, not download-only paths or HTTP methods.
          # Do not add hf.co, *.huggingface.co, or *.hf.space.
          # Safari may not treat script-src 'self' as sufficient for module
          # scripts loaded inside an opaque-origin sandbox iframe, so keep the
          # explicit naidan-curated origins in script-src.
          # Cloudflare Pages may redirect /privacy-fetch-broker.html to the
          # extensionless /privacy-fetch-broker URL. Under COEP: require-corp,
          # the final sandboxed subdocument response also needs CORP, so keep
          # both broker document rules. Do not fix this by adding
          # allow-same-origin to the iframe.
          # The sandboxed broker module graph needs CORP + ACAO, but only
          # under /assets/privacy-fetch-broker/*. Do not make all app assets
          # CORS-readable.
          # The broker is embedded by the same-origin app, so curated CSP must
          # not use frame-ancestors 'none'.
          # Do not add stricter directives such as object-src 'none' or
          # base-uri 'none' here unless local-only gets the same restriction
          # first.
          cat << EOF > dist/hosted/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://naidan-curated.pages.dev https://*.naidan-curated.pages.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://*.wikipedia.org https://*.wikimedia.org https://huggingface.co https://*.hf.co; frame-src 'self'; child-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'none'; manifest-src 'self'

          /privacy-fetch-broker.html
            Cross-Origin-Resource-Policy: cross-origin

          /privacy-fetch-broker
            Cross-Origin-Resource-Policy: cross-origin

          /assets/privacy-fetch-broker/*
            Cross-Origin-Resource-Policy: cross-origin
            Access-Control-Allow-Origin: *

          /docs/assets/*
            Cache-Control: public, max-age=31536000, immutable

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Install Wrangler with retry
        uses: ./.github/actions/install-wrangler-with-retry

      - name: Publish to Cloudflare Pages (Curated)
        id: cloudflare_pages_deploy_curated
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CURATED_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-curated
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v9
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Curated)',
              description: 'Curated-access deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_curated.outputs.deployment-url }}",
            });

  release_to_github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download full dist build artifact
        uses: actions/download-artifact@v8
        with:
          name: full-dist-build
          path: dist

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename zips with tag for release
        run: |
          TAG=${{ steps.get_tag.outputs.TAG_NAME }}
          for ZIP_PATH in dist/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_STEM=${ZIP_PATH%.zip}
            mv "$ZIP_PATH" "${ZIP_STEM}-${TAG}.zip"
          done
          mv dist/naidan-standalone.zip dist/naidan-standalone-${TAG}.zip
          mv dist/naidan-hosted.zip dist/naidan-hosted-${TAG}.zip

      - name: Upload extra assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/naidan-standalone-${{ steps.get_tag.outputs.TAG_NAME }}.zip
            dist/naidan-standalone-*-${{ steps.get_tag.outputs.TAG_NAME }}.zip
            dist/naidan-hosted-${{ steps.get_tag.outputs.TAG_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: naidan-server/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
