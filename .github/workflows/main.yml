name: CI/CD

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/retry-npm-ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        uses: ./.github/actions/retry-npm-ci

      - name: Run tests
        if: ${{ !cancelled() && steps.npm_install.outcome == 'success' }}
        shell: bash
        env:
          FORCE_COLOR: "1"
          npm_config_color: always
        run: |
          mkdir -p "$RUNNER_TEMP/test-logs"
          set -o pipefail

          # Use script to allocate a pseudo-TTY so test reporters keep color
          # output even though tee records the same stream for artifact logs.
          script -q -e -c \
            "npm run test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}" \
            /dev/null 2>&1 \
            | tee "$RUNNER_TEMP/test-logs/npm-test-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}.log"

      - name: Upload test shard log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-test-log-shard-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: ${{ runner.temp }}/test-logs/
          if-no-files-found: warn

  merge_test_logs:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Download all test shard logs
        uses: actions/download-artifact@v7
        with:
          pattern: npm-test-log-shard-*
          path: all-test-logs
          merge-multiple: true

      - name: Upload merged test logs
        uses: actions/upload-artifact@v7
        with:
          name: npm-test-logs
          path: all-test-logs/
          if-no-files-found: error

  test_python_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Python server tests (Isolated)
        run: |
          cd naidan-server.py
          ./run_test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        id: npm_install
        uses: ./.github/actions/retry-npm-ci

      - name: Ensure licenses.json exists
        run: |
          mkdir -p src/assets
          echo '[{"name": "dummy-package-for-tests", "version": "0.0.0", "license": "DUMMY-LICENSE", "licenseText": "This is a placeholder for CI tests."}]' > src/assets/licenses.json

      - name: Run build
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: naidan-server/go.mod

      - name: Verify naidan-server build
        run: |
          cd naidan-server
          go run build.go

      - name: Verify individual artifact inputs
        run: |
          test -f dist/naidan-standalone.zip
          mapfile -t STANDALONE_LOCALES < <(npm exec -- tsx --eval "import { UI_LOCALES } from './src/01-models/ui-locale.ts'; process.stdout.write(UI_LOCALES.join('\n'));")
          test "${#STANDALONE_LOCALES[@]}" -gt 0
          for LOCALE in "${STANDALONE_LOCALES[@]}"; do
            test -f "dist/naidan-standalone-${LOCALE}.zip"
          done
          test -f dist/debug-file-protocol-standalone-build-report.json
          test -d dist/debug-tailwind-standalone
          test -f dist/naidan-hosted.zip
          test -d dist/debug-tailwind-hosted

      - name: Upload full dist build artifact
        uses: actions/upload-artifact@v7
        with:
          name: full-dist-build
          path: dist/

      - name: Upload universal standalone package artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-universal-package
          path: |
            dist/naidan-standalone.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload all standalone locale packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-all-locale-packages
          path: |
            dist/naidan-standalone.zip
            dist/naidan-standalone-*.zip
            dist/debug-file-protocol-standalone-build-report.json
            dist/debug-tailwind-standalone/
          if-no-files-found: error

      - name: Upload hosted artifact
        uses: actions/upload-artifact@v7
        with:
          name: naidan-hosted
          path: |
            dist/naidan-hosted.zip
            dist/debug-tailwind-hosted/
          if-no-files-found: error

      - name: Upload naidan-server binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: naidan-server-binary
          path: naidan-server/naidan-server

  build_profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/retry-npm-ci

      - name: Ensure licenses.json exists
        run: |
          mkdir -p src/assets
          echo '[{"name": "dummy-package-for-tests", "version": "0.0.0", "license": "DUMMY-LICENSE", "licenseText": "This is a placeholder for CI tests."}]' > src/assets/licenses.json

      - name: Prepare exhaustive build profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"
          mkdir -p "$PROFILE_ROOT/plugin-phases" "$PROFILE_ROOT/cpu/vue-tsc" "$PROFILE_ROOT/cpu/standalone" "$PROFILE_ROOT/cpu/hosted"
          : > "$PROFILE_ROOT/top-level-phases.tsv"
          printf 'phase\twall_ms\texit_status\n' >> "$PROFILE_ROOT/top-level-phases.tsv"
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=${RUNNER_OS:-}"
            echo "runner_arch=${RUNNER_ARCH:-}"
            echo "runner_name=${RUNNER_NAME:-}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "nproc=$(nproc)"
            echo
            uname -a || true
            echo
            lscpu || true
            echo
            free -b || true
            echo
            df -h . || true
            echo
            ulimit -a || true
            echo
            npm ls --depth=0 @swc/core @babel/parser @babel/traverse typescript vue-tsc vite rolldown tailwindcss jszip || true
          } > "$PROFILE_ROOT/environment.txt" 2>&1

      - name: Run instrumentation-disabled control A
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"

          run_timed() {
            local label="$1"
            shift
            local started ended wall_ms status
            started=$(date +%s%N)
            set +e
            /usr/bin/time -v -o "$PROFILE_ROOT/${label}-time.txt" "$@" > "$PROFILE_ROOT/${label}.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s%N)
            wall_ms=$(( (ended - started) / 1000000 ))
            printf '%s\t%s\t%s\n' "$label" "$wall_ms" "$status" >> "$PROFILE_ROOT/top-level-phases.tsv"
            return "$status"
          }

          rm -rf dist
          rm -f node_modules/.tmp/tsconfig.app.tsbuildinfo node_modules/.tmp/tsconfig.node.tsbuildinfo

          run_timed control-a-vue-tsc \
            node ./node_modules/vue-tsc/bin/vue-tsc.js -b

          run_timed control-a-standalone \
            node ./node_modules/vite/bin/vite.js build --mode standalone --logLevel warn

          run_timed control-a-hosted \
            node ./node_modules/vite/bin/vite.js build --mode hosted --logLevel warn

      - name: Run timing-only production-order profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"

          run_timed() {
            local label="$1"
            shift
            local started ended wall_ms status
            started=$(date +%s%N)
            set +e
            /usr/bin/time -v -o "$PROFILE_ROOT/${label}-time.txt" "$@" > "$PROFILE_ROOT/${label}.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s%N)
            wall_ms=$(( (ended - started) / 1000000 ))
            printf '%s\t%s\t%s\n' "$label" "$wall_ms" "$status" >> "$PROFILE_ROOT/top-level-phases.tsv"
            return "$status"
          }

          rm -rf dist
          rm -f node_modules/.tmp/tsconfig.app.tsbuildinfo node_modules/.tmp/tsconfig.node.tsbuildinfo

          run_timed timing-vue-tsc \
            node ./node_modules/vue-tsc/bin/vue-tsc.js -b --extendedDiagnostics

          run_timed timing-standalone \
            env \
              NAIDAN_BUILD_PROFILE_DIR="$PROFILE_ROOT/plugin-phases" \
              NAIDAN_BUILD_PROFILE_MODE=timing-standalone \
            node ./node_modules/vite/bin/vite.js build --mode standalone --logLevel warn

          run_timed timing-hosted \
            env \
              NAIDAN_BUILD_PROFILE_DIR="$PROFILE_ROOT/plugin-phases" \
              NAIDAN_BUILD_PROFILE_MODE=timing-hosted \
            node ./node_modules/vite/bin/vite.js build --mode hosted --logLevel warn

          if [ -d dist ]; then
            { printf 'bytes\tpath\n'; find dist -type f -printf '%s\t%p\n' | sort -nr; } > "$PROFILE_ROOT/artifact-sizes.tsv"
            du -sb dist > "$PROFILE_ROOT/dist-total-bytes.txt" || true
            mkdir -p "$PROFILE_ROOT/timing-dist-debug"
            cp -f dist/debug-file-protocol-standalone-build-report.json "$PROFILE_ROOT/timing-dist-debug/" 2>/dev/null || true
            cp -f dist/debug-file-protocol-standalone-release-validation.json "$PROFILE_ROOT/timing-dist-debug/" 2>/dev/null || true
            for directory in dist/debug-tailwind-standalone dist/debug-tailwind-hosted; do
              if [ -d "$directory" ]; then
                destination="$PROFILE_ROOT/timing-dist-debug/$(basename "$directory")"
                mkdir -p "$destination"
                find "$directory" -maxdepth 1 -type f -name '*.json' -exec cp -f {} "$destination/" \;
              fi
            done
          fi

      - name: Run instrumentation-disabled control B
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"

          run_timed() {
            local label="$1"
            shift
            local started ended wall_ms status
            started=$(date +%s%N)
            set +e
            /usr/bin/time -v -o "$PROFILE_ROOT/${label}-time.txt" "$@" > "$PROFILE_ROOT/${label}.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s%N)
            wall_ms=$(( (ended - started) / 1000000 ))
            printf '%s\t%s\t%s\n' "$label" "$wall_ms" "$status" >> "$PROFILE_ROOT/top-level-phases.tsv"
            return "$status"
          }

          rm -rf dist
          rm -f node_modules/.tmp/tsconfig.app.tsbuildinfo node_modules/.tmp/tsconfig.node.tsbuildinfo

          run_timed control-b-vue-tsc \
            node ./node_modules/vue-tsc/bin/vue-tsc.js -b

          run_timed control-b-standalone \
            node ./node_modules/vite/bin/vite.js build --mode standalone --logLevel warn

          run_timed control-b-hosted \
            node ./node_modules/vite/bin/vite.js build --mode hosted --logLevel warn

      - name: Run separate CPU-profile production-order pass
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"

          run_timed() {
            local label="$1"
            shift
            local started ended wall_ms status
            started=$(date +%s%N)
            set +e
            /usr/bin/time -v -o "$PROFILE_ROOT/${label}-time.txt" "$@" > "$PROFILE_ROOT/${label}.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s%N)
            wall_ms=$(( (ended - started) / 1000000 ))
            printf '%s\t%s\t%s\n' "$label" "$wall_ms" "$status" >> "$PROFILE_ROOT/top-level-phases.tsv"
            return "$status"
          }

          rm -rf dist
          rm -f node_modules/.tmp/tsconfig.app.tsbuildinfo node_modules/.tmp/tsconfig.node.tsbuildinfo

          run_timed cpu-vue-tsc \
            node --cpu-prof --cpu-prof-interval=1000 --cpu-prof-dir="$PROFILE_ROOT/cpu/vue-tsc" \
            ./node_modules/vue-tsc/bin/vue-tsc.js -b

          run_timed cpu-standalone \
            node --cpu-prof --cpu-prof-interval=1000 --cpu-prof-dir="$PROFILE_ROOT/cpu/standalone" \
            ./node_modules/vite/bin/vite.js build --mode standalone --logLevel warn

          run_timed cpu-hosted \
            node --cpu-prof --cpu-prof-interval=1000 --cpu-prof-dir="$PROFILE_ROOT/cpu/hosted" \
            ./node_modules/vite/bin/vite.js build --mode hosted --logLevel warn

      - name: Summarize exhaustive build profile
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          PROFILE_ROOT="$RUNNER_TEMP/naidan-build-profile"
          mkdir -p "$PROFILE_ROOT"
          node scripts/summarize-cpu-profile.mjs \
            "$PROFILE_ROOT/cpu/vue-tsc" \
            "$PROFILE_ROOT/vue-tsc-cpu-summary.json" \
            "$PROFILE_ROOT/vue-tsc-cpu-summary.txt" || true
          node scripts/summarize-cpu-profile.mjs \
            "$PROFILE_ROOT/cpu/standalone" \
            "$PROFILE_ROOT/standalone-cpu-summary.json" \
            "$PROFILE_ROOT/standalone-cpu-summary.txt" || true
          node scripts/summarize-cpu-profile.mjs \
            "$PROFILE_ROOT/cpu/hosted" \
            "$PROFILE_ROOT/hosted-cpu-summary.json" \
            "$PROFILE_ROOT/hosted-cpu-summary.txt" || true
          node scripts/summarize-build-profile.mjs "$PROFILE_ROOT" || true

      - name: Upload exhaustive temporary build profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: temporary-naidan-build-profile-swc-exhaustive
          path: ${{ runner.temp }}/naidan-build-profile/
          if-no-files-found: error
          retention-days: 14

  publish_to_cloudflare:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v7
        with:
          name: full-dist-build
          path: dist

      - name: Create _headers
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Publish to Cloudflare Pages
        id: cloudflare_pages_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages',
              description: 'Cloudflare Pages deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy.outputs.deployment-url }}",
            });

  publish_to_cloudflare_local_only:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download full dist build artifact
        uses: actions/download-artifact@v7
        with:
          name: full-dist-build
          path: dist

      - name: Create _headers for local-only
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat << EOF > dist/hosted/_headers
          /*
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:*; frame-ancestors 'none'; form-action 'none';

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Publish to Cloudflare Pages (local-only)
        id: cloudflare_pages_deploy_local
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.LOCAL_ONLY_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-local-only
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Publish legacy compatibility deployment (only-local)
        id: cloudflare_pages_deploy_local_legacy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.ONLY_LOCAL_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-only-local
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Local-Only)',
              description: 'Primary local-only version deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_local.outputs.deployment-url }}",
            });

  publish_to_cloudflare_curated:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Download full dist build artifact
        uses: actions/download-artifact@v7
        with:
          name: full-dist-build
          path: dist

      - name: Create _headers for curated access
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Curated access is intentionally an access-range superset of
          # local-only: keep local-only script/style/img/font/connect
          # allowances, then add only the Wikipedia/Wikimedia endpoints and
          # the sandbox broker requirements.
          # Safari may not treat script-src 'self' as sufficient for module
          # scripts loaded inside an opaque-origin sandbox iframe, so keep the
          # explicit naidan-curated origins in script-src.
          # Cloudflare Pages may redirect /privacy-fetch-broker.html to the
          # extensionless /privacy-fetch-broker URL. Under COEP: require-corp,
          # the final sandboxed subdocument response also needs CORP, so keep
          # both broker document rules. Do not fix this by adding
          # allow-same-origin to the iframe.
          # The sandboxed broker module graph needs CORP + ACAO, but only
          # under /assets/privacy-fetch-broker/*. Do not make all app assets
          # CORS-readable.
          # The broker is embedded by the same-origin app, so curated CSP must
          # not use frame-ancestors 'none'.
          # Do not add stricter directives such as object-src 'none' or
          # base-uri 'none' here unless local-only gets the same restriction
          # first.
          cat << EOF > dist/hosted/_headers
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: require-corp
            Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://naidan-curated.pages.dev https://*.naidan-curated.pages.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://*.wikipedia.org https://*.wikimedia.org; frame-src 'self'; child-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; form-action 'none'; manifest-src 'self'

          /privacy-fetch-broker.html
            Cross-Origin-Resource-Policy: cross-origin

          /privacy-fetch-broker
            Cross-Origin-Resource-Policy: cross-origin

          /assets/privacy-fetch-broker/*
            Cross-Origin-Resource-Policy: cross-origin
            Access-Control-Allow-Origin: *

          /naidan-standalone.zip
            Content-Disposition: attachment; filename="naidan-standalone-v${VERSION}.zip"
          EOF
          for ZIP_PATH in dist/hosted/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_NAME=$(basename "$ZIP_PATH")
            ZIP_STEM=${ZIP_NAME%.zip}
            cat << EOF >> dist/hosted/_headers
          /${ZIP_NAME}
            Content-Disposition: attachment; filename="${ZIP_STEM}-v${VERSION}.zip"
          EOF
          done

      - name: Publish to Cloudflare Pages (Curated)
        id: cloudflare_pages_deploy_curated
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CURATED_CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist/hosted --project-name=naidan-curated
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm

      - name: Add publish URL as commit status
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              context: 'Cloudflare Pages (Curated)',
              description: 'Curated-access deployment',
              state: 'success',
              sha,
              target_url: "${{ steps.cloudflare_pages_deploy_curated.outputs.deployment-url }}",
            });

  release_to_github:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download full dist build artifact
        uses: actions/download-artifact@v7
        with:
          name: full-dist-build
          path: dist

      - name: Get tag name
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Rename zips with tag for release
        run: |
          TAG=${{ steps.get_tag.outputs.TAG_NAME }}
          for ZIP_PATH in dist/naidan-standalone-*.zip; do
            [ -f "$ZIP_PATH" ] || continue
            ZIP_STEM=${ZIP_PATH%.zip}
            mv "$ZIP_PATH" "${ZIP_STEM}-${TAG}.zip"
          done
          mv dist/naidan-standalone.zip dist/naidan-standalone-${TAG}.zip
          mv dist/naidan-hosted.zip dist/naidan-hosted-${TAG}.zip

      - name: Upload extra assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/naidan-standalone-${{ steps.get_tag.outputs.TAG_NAME }}.zip
            dist/naidan-standalone-*-${{ steps.get_tag.outputs.TAG_NAME }}.zip
            dist/naidan-hosted-${{ steps.get_tag.outputs.TAG_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: naidan-server/go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.7.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
