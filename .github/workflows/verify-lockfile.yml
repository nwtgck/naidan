# Regenerate .github/workflows/actions.lock with `gh actions-lock` whenever
# workflows or their `uses:` references change.
name: Verify GitHub Actions lockfile

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile against workflows and upstream refs
        run: gh actions-lock --verify
